name: 🐛 Bug Report
description: Report an issue or unexpected behavior in VER
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with VER! Please fill in as much information as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I connect to an RDP server with multimon enabled...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Open Quick Connect with Ctrl+K
        2. Enter 'rdp://192.168.1.100'
        3. Click 'Connect'
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Affected Protocol / Feature
      options:
        - RDP / XRDP (xfreerdp3)
        - VNC (vncviewer)
        - SSH
        - SPICE (remote-viewer)
        - Quick Connect
        - Import / Export
        - Reachability Prober / WoL
        - UI / Theming / Shortcuts
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS distribution, desktop environment, and session type (e.g. Fedora 40 GNOME 46 Wayland, Arch KDE Plasma 6 X11).
      placeholder: Ubuntu 24.04 LTS, GNOME 46 (Wayland)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VER Version
      description: Run `ver --version` or check the About dialog in the app.
      placeholder: v1.3.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Error Output
      description: Paste any relevant terminal logs or session output (please sanitize sensitive information).
      render: shell
