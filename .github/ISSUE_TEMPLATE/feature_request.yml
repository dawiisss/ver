name: 💡 Feature Request
description: Propose a new feature, protocol connector, or enhancement for VER
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make VER better!
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a specific problem or missing capability?
      placeholder: I frequently need to connect to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new feature you would like to see added.
      placeholder: Add an option to configure...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any screenshots, mockups, or extra context about the feature request here.
