name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config alien rpm zstd wget

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Build Debian (.deb) package
        run: bash build_deb.sh ${{ github.ref_name }}

      - name: Build RedHat (.rpm) package
        run: bash build_rpm.sh ${{ github.ref_name }}

      - name: Build Arch Linux (.pkg.tar.zst / pacman) package
        run: bash build_pacman.sh ${{ github.ref_name }}

      - name: Build AppImage (.AppImage) package
        run: bash build_appimage.sh ${{ github.ref_name }}

      - name: Build Standalone Tarball (.tar.gz)
        run: |
          mkdir -p staging
          cp target/release/beautiful-goodall staging/ver
          cp data/com.example.ver.desktop staging/
          cp data/com.example.ver.png staging/
          tar -czvf ver-linux-x86_64-${{ github.ref_name }}.tar.gz -C staging .

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
            *.pkg.tar.zst
            *.AppImage
            ver-linux-x86_64-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
