[package]
name = "beautiful-goodall"
version = "1.0.0"
edition = "2021"

[lib]
name = "beautiful_goodall"
path = "src/lib.rs"

[[bin]]
name = "beautiful-goodall"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.7" }
libadwaita = { version = "0.5", features = ["v1_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
oo7 = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
dirs = "5.0"
tempfile = "3.8"
ksni = { version = "0.3.6", features = ["blocking"] }
local-ip-address = "0.6.13"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
async-channel = "2.5.0"
libc = "0.2"

[dev-dependencies]
