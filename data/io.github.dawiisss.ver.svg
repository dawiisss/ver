  <rect width="128" height="128" rx="28" fill="#1e1d28"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#2a2938" stroke-width="2"/>
  
  <!-- Formal Minimalist Remote Connection Manager Motif -->
  <!-- Primary Host Terminal Screen -->
  <rect x="22" y="42" width="46" height="44" rx="7" fill="none" stroke="#c5d0f7" stroke-width="5"/>
  <!-- Command Prompt '>' -->
  <path d="M33 56 L42 64 L33 72" fill="none" stroke="#c5d0f7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor '_' -->
  <line x1="47" y1="72" x2="56" y2="72" stroke="#c5d0f7" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Connection Link Bridge -->
  <line x1="68" y1="64" x2="78" y2="64" stroke="#c5d0f7" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Remote Target Display -->
  <rect x="78" y="47" width="30" height="34" rx="6" fill="none" stroke="#c5d0f7" stroke-width="4.5"/>
  <!-- Active Connection Node Signal Dot -->
